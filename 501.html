<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="501.css"><title>Darts 501</title></head><body><div class="shell"><header class="mode-topbar"><nav class="mode-switch"><a class="mode-pill" href="index.html">Around the Clock</a><a class="mode-pill" href="cricket.html">Cricket</a><a class="mode-pill active" href="501.html">501</a></nav><button id="themeToggle" class="icon-button">◐</button></header><main>
<section id="setup"><article class="card"><div class="heading"><h2>501 · Double Out</h2><span class="badge">501</span></div><p class="muted">Zum Gewinnen musst du exakt 0 erreichen. Der letzte Dart muss ein Double oder Inner Bull sein. Bei Bust wird die ganze Aufnahme zurückgesetzt.</p><div id="lineup" class="empty">Noch niemand ausgewählt.</div><button id="startBtn" class="primary" disabled>501 starten</button></article><article class="card"><div class="heading"><h2>Spieler</h2></div><form id="nameForm" class="inline"><input id="nameInput" maxlength="24" placeholder="Name"><button class="primary square">+</button></form><div id="savedPlayers"></div></article></section>
<section id="game" hidden><div class="game-tools"><button id="backBtn" class="tool">←</button><div id="turnInfo" class="turn-info"></div><button id="undoBtn" class="tool">↶</button><button id="resetBtn" class="tool danger">↻</button></div><article class="card"><div id="scores"></div></article><article class="card"><div class="heading"><h2 id="playerName"></h2><span id="dartCount" class="badge">0/3</span></div><div id="numbers" class="num-grid"></div><div class="mult-grid"><button data-m="1" class="mult selected">Single</button><button data-m="2" class="mult">Double</button><button data-m="3" class="mult">Triple</button></div><button id="missBtn" class="secondary full">Miss</button><div id="checkoutHint" class="hint"></div></article></section></main></div><dialog id="winDialog"><div class="dialog-card"><h2 id="winTitle"></h2><p id="winSummary"></p><button id="againBtn" class="primary">Revanche</button><button id="setupBtn" class="secondary">Teilnehmer</button></div></dialog><script src="501.js"></script></body></html>
