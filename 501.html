<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="501.css?v=31" />
  <link rel="stylesheet" href="mode-nav.css" />
  <title>Darts 501</title>
</head>
<body><div class="shell">
<header class="mode-topbar">
  <nav class="mode-switch" aria-label="Spielmodus">
    <a class="mode-pill" href="index.html">Around the Clock</a>
    <a class="mode-pill" href="cricket.html">Cricket</a>
    <a class="mode-pill active" href="501.html">501</a>
  </nav>
  <button id="themeToggle" class="icon-button" type="button" aria-label="Hell-/Dunkelmodus umschalten">◐</button>
</header>
<main>
<section id="setup">
  <article class="card">
    <div class="heading"><h2>501 · Double Out</h2><span class="badge">501</span></div>
    <div id="lineup" class="empty">Noch niemand ausgewählt.</div>
    <button id="startBtn" class="primary full" disabled>501 starten</button>
  </article>
  <div class="two-col">
    <article class="card">
      <div class="heading"><h2>Menschen</h2></div>
      <form id="nameForm" class="inline"><input id="nameInput" maxlength="24" placeholder="Name"><button class="primary square" type="submit">+</button></form>
      <div id="savedPlayers"></div>
    </article>
    <article class="card">
      <div class="heading"><h2>Bots</h2></div>
      <div class="inline">
        <select id="botLevel">
          <option value="rookie">Anfänger</option><option value="casual">Leicht</option><option value="normal" selected>Mittel</option><option value="strong">Schwer</option><option value="expert">Profi</option>
        </select>
        <button id="addBotBtn" class="primary square" type="button">+</button>
      </div>
      <button id="addAllBotsBtn" class="secondary full" type="button">Alle 5 Bots hinzufügen</button>
    </article>
  </div>
</section>

<section id="game" hidden>
  <div class="game-tools">
    <button id="backBtn" class="tool" type="button">←</button>
    <div id="turnInfo" class="turn-info"></div>
    <button id="undoBtn" class="tool" type="button">↶</button>
    <button id="resetBtn" class="tool danger" type="button">↻</button>
  </div>

  <article class="card player-list-card"><div id="scores" class="player-list"></div></article>

  <article class="card throw-card">
    <div class="heading"><h2 id="playerName">Spieler</h2><span id="dartCount" class="badge">0/3</span></div>

    <div class="number-rows">
      <div id="numbersRow1" class="number-row"></div>
      <div id="numbersRow2" class="number-row"></div>
      <div id="numbersRow3" class="number-row"></div>
    </div>

    <div class="mult-grid two-mults">
      <button data-m="2" class="mult" type="button">Double</button>
      <button data-m="3" class="mult" type="button">Triple</button>
    </div>

    <button id="missBtn" class="secondary full miss" type="button">Miss</button>
    <div id="checkoutHint" class="hint"></div>
  </article>
  <div id="botStatus" class="card bot-status" hidden>Bot wirft …</div>
</section>
</main></div>
<dialog id="winDialog"><div class="dialog-card"><h2 id="winTitle"></h2><p id="winSummary"></p><button id="continue501Btn" class="primary" hidden>Weiter spielen</button><button id="againBtn" class="primary">Revanche</button><button id="setupBtn" class="secondary">Teilnehmer</button></div></dialog>
<script src="501.js?v=31"></script>
</body></html>
