<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Darts Cricket für menschliche Spieler und Bots." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="cricket.css?v=13" />
  <title>Darts Cricket</title>
</head>
<body>
  <div class="cricket-shell">
    <header class="topbar">
      <div>
        <h1>Darts Trainer</h1>
        <p>Cricket</p>
      </div>
      <div class="topbar-actions">
        <a class="mode-link" href="index.html">Around the Clock</a>
        <button id="themeToggle" class="icon-button" type="button" aria-label="Hell-/Dunkelmodus umschalten">◐</button>
      </div>
    </header>

    <main>
      <section id="setupView" class="screen active" aria-label="Cricket einrichten">
        <article class="setup-card lineup-panel">
          <div class="section-heading">
            <h2>Teilnehmer</h2>
            <span class="capacity-label"><span id="lineupCount">0</span>/6</span>
          </div>
          <div id="selectedLineup" class="selected-lineup empty-copy">Noch niemand ausgewählt.</div>
          <button id="startGameBtn" class="cta-button" type="button" disabled>Cricket starten</button>
          <p id="setupMessage" class="form-message" role="status"></p>
        </article>

        <div class="setup-columns">
          <article class="setup-card">
            <div class="section-heading">
              <h2>Menschen</h2>
            </div>
            <form id="createPlayerForm" class="create-player-form">
              <label class="sr-only" for="playerNameInput">Name des Spielers</label>
              <input id="playerNameInput" maxlength="24" autocomplete="off" placeholder="Neuer Name" />
              <button class="small-primary" type="submit">+</button>
            </form>
            <div id="savedPlayers" class="saved-list"></div>
          </article>

          <article class="setup-card bot-panel">
            <div class="section-heading">
              <h2>Bot</h2>
            </div>
            <div class="bot-add-row">
              <label class="sr-only" for="botDifficulty">Schwierigkeit</label>
              <select id="botDifficulty">
                <option value="rookie">Anfänger</option>
                <option value="casual">Locker</option>
                <option value="normal" selected>Normal</option>
                <option value="strong">Stark</option>
                <option value="expert">Experte</option>
              </select>
              <button id="addBotBtn" class="small-primary bot-add-button" type="button">+</button>
            </div>
          </article>
        </div>

        <article id="historyPanel" class="setup-card history-panel">
          <div class="section-heading">
            <h2>Letzte Spiele</h2>
            <button id="clearHistoryBtn" class="quiet-button danger-button" type="button">Löschen</button>
          </div>
          <div id="cricketHistory" class="cricket-history empty-copy">Noch kein Spiel abgeschlossen.</div>
        </article>
      </section>

      <section id="gameView" class="screen game-screen" aria-label="Cricket-Spiel">
        <div class="game-toolbar">
          <button id="backToSetupBtn" class="toolbar-button" type="button" aria-label="Zurück">←</button>
          <div id="turnDots" class="turn-dots" aria-label="Würfe in dieser Aufnahme">
            <span></span><span></span><span></span>
          </div>
          <button id="gameThemeToggle" class="toolbar-button" type="button" aria-label="Hell-/Dunkelmodus umschalten">◐</button>
          <button id="undoDartBtn" class="toolbar-button" type="button" aria-label="Letzten Wurf zurück">↶</button>
          <button id="resetGameBtn" class="toolbar-button danger-toolbar-button" type="button" aria-label="Spiel neu starten">↻</button>
        </div>

        <div id="scoreboardWrap" class="scoreboard-wrap" aria-label="Cricket-Scoreboard">
          <table id="scoreboard" class="scoreboard"></table>
        </div>

        <div class="throw-area">
          <div id="humanControls" class="human-controls">
            <div id="targetButtons" class="target-button-grid"></div>
            <div id="multiplierButtons" class="multiplier-grid" aria-label="Wurfart">
              <button class="modifier-button" data-multiplier="2" type="button">Double</button>
              <button class="modifier-button" data-multiplier="3" type="button">Triple</button>
            </div>
          </div>

          <div id="botControls" class="bot-status" hidden aria-live="polite">
            <span class="bot-loading-dot"></span>
            <span>Bot wirft</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="winnerDialog" class="winner-dialog">
    <div class="winner-content">
      <div class="trophy-mark">WIN</div>
      <h2 id="winnerTitle">Gewonnen!</h2>
      <p id="winnerSummary"></p>
      <div id="finalScores" class="final-scores"></div>
      <div class="winner-actions">
        <button id="rematchBtn" class="cta-button" type="button">Revanche</button>
        <button id="winnerSetupBtn" class="outline-button" type="button">Teilnehmer</button>
      </div>
    </div>
  </dialog>

  <script src="cricket.js?v=13"></script>
</body>
</html>
